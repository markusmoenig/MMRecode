[package]
name = "mmrecode"
description = "Terminal-first media editor and codec tools for MMRecode"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mmrecode"
path = "src/main.rs"

[dependencies]
base64-simd.workspace = true
directories.workspace = true
image = { workspace = true, features = ["png"] }
mmrecode-core.workspace = true
mmrecode-aac.workspace = true
mmrecode-dv.workspace = true
mmrecode-edit.workspace = true
mmrecode-h264.workspace = true
mmrecode-isobmff.workspace = true
mmrecode-mjpeg.workspace = true
mmrecode-mmfx.workspace = true
mmrecode-mpegaudio.workspace = true
mmrecode-mpeg2.workspace = true
mmrecode-mpegts.workspace = true
mmrecode-playback.workspace = true
mmrecode-quality.workspace = true
mmrecode-render = { workspace = true, features = ["h264", "mmfx", "mpegts"] }
mmrecode-y4m.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
rodio.workspace = true

[lints]
workspace = true
