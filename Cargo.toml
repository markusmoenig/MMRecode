[workspace]
members = [
    "crates/apps/viewer",
    "crates/bitstream",
    "crates/capi",
    "crates/cli",
    "crates/codecs/dv",
    "crates/codecs/mjpeg",
    "crates/codecs/mpeg2",
    "crates/containers/mpegts",
    "crates/containers/y4m",
    "crates/core",
    "crates/quality",
    "crates/testkit",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["Markus Moenig"]
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
mmrecode-bitstream = { path = "crates/bitstream" }
mmrecode-capi = { path = "crates/capi" }
mmrecode-core = { path = "crates/core" }
mmrecode-dv = { path = "crates/codecs/dv" }
mmrecode-mjpeg = { path = "crates/codecs/mjpeg" }
mmrecode-mpeg2 = { path = "crates/codecs/mpeg2" }
mmrecode-mpegts = { path = "crates/containers/mpegts" }
mmrecode-quality = { path = "crates/quality" }
mmrecode-testkit = { path = "crates/testkit" }
mmrecode-y4m = { path = "crates/containers/y4m" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
