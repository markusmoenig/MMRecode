[workspace]
members = [
    "crates/bitstream",
    "crates/cli",
    "crates/codecs/mjpeg",
    "crates/containers/y4m",
    "crates/core",
    "crates/quality",
    "crates/testkit",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["Markus Moenig"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
mmrecode-bitstream = { path = "crates/bitstream" }
mmrecode-core = { path = "crates/core" }
mmrecode-mjpeg = { path = "crates/codecs/mjpeg" }
mmrecode-quality = { path = "crates/quality" }
mmrecode-testkit = { path = "crates/testkit" }
mmrecode-y4m = { path = "crates/containers/y4m" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

